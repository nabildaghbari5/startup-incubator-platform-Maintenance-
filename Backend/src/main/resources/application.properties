# ==================================
# SERVER
# ==================================
server.port=8083

# ==================================
# MYSQL
# ==================================
spring.datasource.url=jdbc:mysql://localhost:3306/s2thub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ==================================
# JPA / HIBERNATE
# ==================================
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# supprimer ancienne ligne dialect inutile
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==================================
# JWT
# ==================================
jwt.secret=s2tIncubateurSecretKeyPFE2024VeryLongSecureKeyForHMACSHA256Algorithm
jwt.expiration=86400000

# ==================================
# CORS
# ==================================
app.frontend.url=http://localhost:4200

# ==================================
# UPLOAD FICHIERS
# ==================================
app.upload.dir=uploads
application.file.uploads.photos-output-path= ./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB